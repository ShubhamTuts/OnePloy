services:
  coolify:
    image: "${ONEPLOY_REGISTRY:-ghcr.io/shubhamtuts}/oneploy:${ONEPLOY_VERSION:-latest}"
    volumes:
      - type: bind
        source: /data/oneploy/source/.env
        target: /var/www/html/.env
        read_only: true
      - /data/oneploy/ssh:/var/www/html/storage/app/ssh
      - /data/oneploy/applications:/var/www/html/storage/app/applications
      - /data/oneploy/databases:/var/www/html/storage/app/databases
      - /data/oneploy/services:/var/www/html/storage/app/services
      - /data/oneploy/backups:/var/www/html/storage/app/backups
      - /data/oneploy/images:/var/www/html/storage/app/images
    environment:
      - APP_ENV=${APP_ENV:-production}
      - APP_NAME=${APP_NAME:-OnePloy}
      - ONEPLOY_VERSION=${ONEPLOY_VERSION:-latest}
      - PHP_MEMORY_LIMIT=${PHP_MEMORY_LIMIT:-256M}
      - PHP_FPM_PM_CONTROL=${PHP_FPM_PM_CONTROL:-dynamic}
      - PHP_FPM_PM_START_SERVERS=${PHP_FPM_PM_START_SERVERS:-1}
      - PHP_FPM_PM_MIN_SPARE_SERVERS=${PHP_FPM_PM_MIN_SPARE_SERVERS:-1}
      - PHP_FPM_PM_MAX_SPARE_SERVERS=${PHP_FPM_PM_MAX_SPARE_SERVERS:-10}
    env_file:
      - /data/oneploy/source/.env
    ports:
      - "${APP_PORT:-8000}:8080"
    expose:
      - "${APP_PORT:-8000}"
    healthcheck:
      test: curl --fail http://127.0.0.1:8080/api/health || exit 1
      interval: 5s
      retries: 24
      start_period: 1m
      timeout: 2s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      soketi:
        condition: service_healthy

  postgres:
    volumes:
      - oneploy-db:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: "${DB_USERNAME}"
      POSTGRES_PASSWORD: "${DB_PASSWORD}"
      POSTGRES_DB: "${DB_DATABASE:-oneploy}"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE:-oneploy}" ]
      interval: 5s
      retries: 10
      timeout: 2s

  redis:
    command: redis-server --save 20 1 --loglevel warning --requirepass ${REDIS_PASSWORD}
    environment:
      REDIS_PASSWORD: "${REDIS_PASSWORD}"
    volumes:
      - oneploy-redis:/data
    healthcheck:
      test: [ "CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD} ping | grep -q PONG" ]
      interval: 5s
      retries: 10
      timeout: 2s

  soketi:
    image: "${ONEPLOY_REGISTRY:-ghcr.io/shubhamtuts}/oneploy-realtime:${ONEPLOY_REALTIME_VERSION:-latest}"
    ports:
      - "${SOKETI_PORT:-6001}:6001"
      - "${SOKETI_TERMINAL_PORT:-6002}:6002"
    volumes:
      - /data/oneploy/ssh:/var/www/html/storage/app/ssh
    environment:
      APP_NAME: "${APP_NAME:-OnePloy}"
      SOKETI_DEBUG: "${SOKETI_DEBUG:-false}"
      SOKETI_DEFAULT_APP_ID: "${PUSHER_APP_ID}"
      SOKETI_DEFAULT_APP_KEY: "${PUSHER_APP_KEY}"
      SOKETI_DEFAULT_APP_SECRET: "${PUSHER_APP_SECRET}"
      SOKETI_HOST: "${SOKETI_HOST:-0.0.0.0}"
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://127.0.0.1:6001/ready && wget -qO- http://127.0.0.1:6002/ready || exit 1" ]
      interval: 5s
      retries: 10
      timeout: 2s

volumes:
  oneploy-db:
    name: oneploy-db
  oneploy-redis:
    name: oneploy-redis

# The inherited service key/network identifier remains temporarily for
# compatibility with existing application code. It is not an external service
# or Coolify runtime dependency. A later compatibility migration can rename it
# after all code paths and upgrade tests are covered.
networks:
  coolify:
    external: true
